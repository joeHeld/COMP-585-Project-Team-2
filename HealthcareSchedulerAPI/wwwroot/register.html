<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">

<div class="login-card">
    <div class="login-icon">ጸ+</div>
    <h1>Create Account</h1>
    <p class="subtitle">Join our healthcare platform</p>

    <form onsubmit="registerUser(event)">
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input id="fullName" type="text" placeholder="John Doe" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="john@example.com" required>
        </div>

        <div class="form-group">
            <label for="phoneNumber">Phone Number</label>
            <input id="phoneNumber" type="tel" placeholder="+1 (555) 000-0000" required>
        </div>

        <div class="form-group">
            <label for="dateOfBirth">Date of Birth</label>
            <input id="dateOfBirth" type="date" placeholder="mm/dd/yyyy" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Create a strong password" required>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" type="password" placeholder="Re-enter your password" required>
        </div>

        <button class="login-btn" type="submit">Create Account</button>
    </form>

    <div class="register-text">
        Already have an account? <a href="/login.html">Sign in here</a>
    </div>

</div>

<script src="/js/auth.js"></script>
</body>
</html>
