<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body class="dashboard-page">

    <div class="dashboard-layout">
        <aside class="dashboard-sidebar">
            <div>
                <div class="sidebar-brand-wrap">
                    <h2 class="brand">HealthCare</h2>
                    <p class="brand-sub">Appointment System</p>
                </div>

                <nav class="sidebar-nav">
                    <a href="/dashboard.html">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 10.5L12 3l9 7.5"></path>
                                <path d="M5 9.5V20h14V9.5"></path>
                            </svg>
                        </span>
                        <span>Dashboard</span>
                    </a>

                    <a href="/book-appointment.html">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                                <path d="M16 3v4M8 3v4M3 10h18"></path>
                            </svg>
                        </span>
                        <span>Book Appointment</span>
                    </a>

                    <a class="active" href="/my-appointments.html">
                        <span class="nav-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="5" y="3" width="14" height="18" rx="2"></rect>
                                <path d="M9 7h6M9 12h6M9 16h4"></path>
                            </svg>
                        </span>
                        <span>My Appointments</span>
                    </a>
                </nav>
            </div>

            <div class="sidebar-user">
                <div class="sidebar-user-top">
                    <div class="user-avatar-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M4 20c1.8-3.5 5-5 8-5s6.2 1.5 8 5"></path>
                        </svg>
                    </div>
                    <div>
                        <div class="user-name" id="userName"></div>
                        <div class="user-role">Patient</div>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </aside>

        <main class="dashboard-main">
            <div class="appointments-shell">
                <h1 class="appointments-heading">My Appointments</h1>
                <p class="appointments-subheading">View and manage your healthcare appointments</p>

                <div class="appointments-tabs">
                    <button class="appointments-tab active" type="button" id="upcomingTab">Upcoming</button>
                    <button class="appointments-tab" type="button" id="pastTab">Past Appointments</button>
                </div>

                <section class="appointments-table-card">
                    <div class="appointments-table-header">
                        <div>Provider</div>
                        <div>Specialty</div>
                        <div>Date &amp; Time</div>
                        <div>Reason</div>
                        <div>Status</div>
                        <div class="appointments-actions-header">Actions</div>
                    </div>

                    <div id="appointmentsTableBody">
                        <div class="appointments-empty-row">Loading appointments...</div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("user"));
        let allAppointments = [];
        let currentFilter = "upcoming";

        if (!user) {
            window.location.href = "/login.html";
        } else {
            const userNameEl = document.getElementById("userName");
            if (userNameEl) {
                userNameEl.innerText = user.fullName || "Patient";
            }
        }

        function logout() {
            localStorage.removeItem("user");
            window.location.href = "/login.html";
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString("en-US", {
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            });
        }

        function formatTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleTimeString("en-US", {
                hour: "numeric",
                minute: "2-digit"
            });
        }

        function getStatusClass(statusText) {
            const value = (statusText || "").toLowerCase();

            if (value === "confirmed") return "confirmed";
            if (value === "cancelled") return "cancelled";
            return "pending";
        }

        function isPastAppointment(dateString) {
            return new Date(dateString) < new Date();
        }

        function renderAppointments() {
            const tableBody = document.getElementById("appointmentsTableBody");

            const filteredAppointments = allAppointments.filter(appointment => {
                const isPast = isPastAppointment(appointment.appointmentDateTime);
                return currentFilter === "upcoming" ? !isPast : isPast;
            });

            if (!filteredAppointments.length) {
                tableBody.innerHTML = `
            <div class="appointments-empty-row">
                No ${currentFilter === "upcoming" ? "upcoming" : "past"} appointments found.
            </div>
        `;
                return;
            }

            tableBody.innerHTML = filteredAppointments.map(appointment => {
                const providerName = appointment.providerName || `Provider ID: ${appointment.providerId}`;
                const specialty = appointment.providerSpecialty || "Healthcare Provider";
                const reason = appointment.reason || "—";
                const statusText = appointment.status || "Pending";
                const statusClass = getStatusClass(statusText);
                const canCancel = currentFilter === "upcoming" && statusText.toLowerCase() !== "cancelled";

                return `
            <div class="appointments-table-row">
                <div class="appointments-provider-cell">
                    <span class="provider-mini-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M6 20c1.5-3 4-4.5 6-4.5S16.5 17 18 20"></path>
                        </svg>
                    </span>
                    <span>${providerName}</span>
                </div>

                <div class="appointments-cell-muted">${specialty}</div>

                <div class="appointments-datetime-cell">
                    <div class="appointments-date-line">
                        <span class="mini-meta-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                                <path d="M16 3v4M8 3v4M3 10h18"></path>
                            </svg>
                        </span>
                        <span>${formatDate(appointment.appointmentDateTime)}</span>
                    </div>
                    <div class="appointments-time-line">
                        <span class="mini-meta-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="9"></circle>
                                <path d="M12 7v5l3 2"></path>
                            </svg>
                        </span>
                        <span>${formatTime(appointment.appointmentDateTime)}</span>
                    </div>
                </div>

                <div class="appointments-cell-muted">${reason}</div>

                <div>
                    <span class="status ${statusClass}">${statusText}</span>
                </div>

                <div class="appointments-actions-cell">
                    ${canCancel
                        ? `<button class="cancel-pill-btn" onclick="cancelAppointment(${appointment.id})">Cancel</button>`
                        : `<span class="appointments-dots-btn">⋮</span>`
                    }
                </div>
            </div>
        `;
            }).join("");
        }

        async function loadAppointments() {
            const tableBody = document.getElementById("appointmentsTableBody");

            try {
                const response = await fetch("/api/appointments/patient/" + user.id);

                if (!response.ok) {
                    throw new Error("Failed to load appointments");
                }

                allAppointments = await response.json();
                renderAppointments();
            } catch (error) {
                tableBody.innerHTML = `
            <div class="appointments-empty-row">
                Unable to load appointments right now.
            </div>
        `;
                console.error(error);
            }
        }

        async function cancelAppointment(appointmentId) {
            const confirmed = confirm("Are you sure you want to cancel this appointment?");
            if (!confirmed) return;

            try {
                const response = await fetch("/api/appointments/cancel/" + appointmentId, {
                    method: "POST"
                });

                if (!response.ok) {
                    throw new Error("Failed to cancel appointment");
                }

                await loadAppointments();
            } catch (error) {
                alert("Could not cancel appointment. Please try again.");
                console.error(error);
            }
        }

        document.getElementById("upcomingTab").addEventListener("click", function () {
            currentFilter = "upcoming";
            document.getElementById("upcomingTab").classList.add("active");
            document.getElementById("pastTab").classList.remove("active");
            renderAppointments();
        });

        document.getElementById("pastTab").addEventListener("click", function () {
            currentFilter = "past";
            document.getElementById("pastTab").classList.add("active");
            document.getElementById("upcomingTab").classList.remove("active");
            renderAppointments();
        });

        loadAppointments();
    </script>

</body>

</html>
