<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="dashboard-page">

<div class="dashboard-layout">
<aside class="dashboard-sidebar">
    <div>
        <div class="sidebar-brand-wrap">
            <h2 class="brand">HealthCare</h2>
            <p class="brand-sub">Appointment System</p>
        </div>

        <nav class="sidebar-nav">
            <a href="/dashboard.html">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 10.5L12 3l9 7.5"></path>
                        <path d="M5 9.5V20h14V9.5"></path>
                    </svg>
                </span>
                <span>Dashboard</span>
            </a>

            <a class="active" href="/book-appointment.html">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                        <path d="M16 3v4M8 3v4M3 10h18"></path>
                    </svg>
                </span>
                <span>Book Appointment</span>
            </a>

            <a href="/my-appointments.html">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="5" y="3" width="14" height="18" rx="2"></rect>
                        <path d="M9 7h6M9 12h6M9 16h4"></path>
                    </svg>
                </span>
                <span>My Appointments</span>
            </a>
        </nav>
    </div>

    <div class="sidebar-user">
        <div class="sidebar-user-top">
            <div class="user-avatar-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 20c1.8-3.5 5-5 8-5s6.2 1.5 8 5"></path>
                </svg>
            </div>
            <div>
                <div class="user-name" id="userName"></div>
                <div class="user-role">Patient</div>
            </div>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</aside>

    <main class="dashboard-main">
        <section class="book-shell">
            <h1 class="book-heading">Book an Appointment</h1>
            <p class="book-subheading">Schedule your next medical consultation</p>

            <div class="book-panel">
                <form onsubmit="bookAppointment(event)">
                    <div class="book-field">
                        <label for="providerId">Select Healthcare Provider</label>
                        <select id="providerId" class="book-input" required>
                            <option value="">Choose a provider</option>
                            <option value="1">Dr. Sarah Johnson</option>
                            <option value="2">Dr. Michael Chen</option>
                            <option value="3">Dr. Emily Williams</option>
                        </select>
                    </div>

                    <div class="book-field">
                        <label for="appointmentDate">Select Date</label>
                        <input id="appointmentDate" class="book-input" type="date" required>
                    </div>

<div class="book-field">
    <label for="appointmentTime">Select Time Slot</label>
    <select id="appointmentTime" class="book-input" required>
        <option value="">Choose a time slot</option>
        <option value="09:00">09:00 AM</option>
        <option value="09:30">09:30 AM</option>
        <option value="10:00">10:00 AM</option>
        <option value="10:30">10:30 AM</option>
        <option value="11:00">11:00 AM</option>
        <option value="11:30">11:30 AM</option>
        <option value="14:00">02:00 PM</option>
        <option value="14:30">02:30 PM</option>
        <option value="15:00">03:00 PM</option>
        <option value="15:30">03:30 PM</option>
        <option value="16:00">04:00 PM</option>
        <option value="16:30">04:30 PM</option>
    </select>
</div>

                    <div class="book-field">
                        <label for="reason">Reason for Visit</label>
                        <textarea
                            id="reason"
                            class="book-input book-textarea"
                            placeholder="Please describe the reason for your appointment..."
                            required
                        ></textarea>
                    </div>

                    <div class="book-button-row">
                        <button type="submit" class="book-primary-btn">Confirm Appointment</button>
                        <button type="button" class="book-secondary-btn" onclick="window.location.href='/dashboard.html'">Cancel</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>

<script src="/js/auth.js"></script>
<script>
const user = JSON.parse(localStorage.getItem("user"));

if (!user) {
    window.location.href = "/login.html";
} else {
    const userNameEl = document.getElementById("userName");
    if (userNameEl) {
        userNameEl.innerText = user.fullName || "Patient";
    }
}

function logout() {
    localStorage.removeItem("user");
    window.location.href = "/login.html";
}
</script>

</body>
</html>
